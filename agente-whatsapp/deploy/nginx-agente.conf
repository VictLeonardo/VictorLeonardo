# Entrada publica do agente: HTTPS na frente, agente no localhost.
#
# O agente escuta so' em 127.0.0.1 e fala HTTP puro. Quem termina TLS e' o
# nginx, na mesma maquina. Isso importa porque a Z-API nao assina o corpo do
# webhook nem aceita cabecalho proprio: o nosso segredo vai na query string
# (?s=...). Em HTTP aberto, esse segredo viajaria em claro.
#
# Este arquivo e' o bloco HTTP. Rode `certbot --nginx -d agente.SEU-DOMINIO`
# depois de instalar: o certbot acrescenta o bloco 443 e o redirect sozinho.
#
# Validar sempre com `nginx -t` antes de recarregar.

# A query string carrega o segredo, entao o formato padrao ($request, que
# inclui a query) gravaria o segredo em texto puro no disco, em todo pedido.
# Este formato registra so' o caminho.
log_format sem_query '$remote_addr - [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent "$http_user_agent"';

# Teto de pedidos: o endereco e' publico, e so' a Z-API deveria chama-lo.
limit_req_zone $binary_remote_addr zone=agente:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agente.SEU-DOMINIO;

    access_log /var/log/nginx/agente.log sem_query;
    error_log  /var/log/nginx/agente.erro.log;

    # So' o webhook e' publico. /saude fica de fora de proposito: ele devolve o
    # id do grupo, e isso nao e' assunto de quem passa na rua. Para conferir a
    # saude, use `curl localhost:8080/saude` na propria VPS.
    location = /webhook {
        limit_req zone=agente burst=10 nodelay;
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A Z-API reenvia e chega a desligar o webhook quando a resposta demora.
        # O agente responde antes de trabalhar, entao estes tempos sao folga.
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
